name: Build on Windows

on: [push, pull_request]

env:
  VCPKG_EXE: C:\vcpkg\vcpkg.exe
  FEED_URL: https://nuget.pkg.github.com/Kwizatz/index.json
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/Kwizatz/index.json,readwrite;nugettimeout,900"
  VCPKG_FEATURE_FLAGS: "binarycaching,manifests,versions"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install xxd
      shell: pwsh
      run: choco install xxd -y

    - name: Update VCPKG
      shell: pwsh
      run: |
        cd C:\vcpkg
        git pull
        .\bootstrap-vcpkg.bat

    - name: Add NuGet sources
      shell: pwsh
      run: |
        .$(${{ env.VCPKG_EXE }} fetch nuget) `
          sources add `
          -Source "${{ env.FEED_URL }}" `
          -StorePasswordInClearText `
          -Name GitHubPackages `
          -UserName "Kwizatz" `
          -Password "${{ secrets.PAT }}"
        .$(${{ env.VCPKG_EXE }} fetch nuget) `
          setapikey "${{ secrets.PAT }}" `
          -Source "${{ env.FEED_URL }}"

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -DCMAKE_TOOLCHAIN_FILE="C:\vcpkg\scripts\buildsystems\vcpkg.cmake" -B ${{github.workspace}}/build

    - name: Build
      run: cmake --build ${{github.workspace}}/build

    - name: Delete old NuGet packages from feed
      if: github.ref == 'refs/heads/master' && github.event_name == 'push'
      shell: pwsh
      run: |
        $headers = @{
          Authorization = "Bearer ${{ secrets.PAT }}"
          Accept        = "application/vnd.github+json"
        }
        $owner = "Kwizatz"
        $packagesUrl = "https://api.github.com/user/packages?package_type=nuget&per_page=100"
        $packages = Invoke-RestMethod -Uri $packagesUrl -Headers $headers

        foreach ($pkg in $packages) {
          $versionsUrl = "https://api.github.com/user/packages/nuget/$($pkg.name)/versions?per_page=100"
          $versions = Invoke-RestMethod -Uri $versionsUrl -Headers $headers

          if ($versions.Count -le 1) {
            Write-Host "Package $($pkg.name): only $($versions.Count) version(s), skipping."
            continue
          }

          # Versions are returned newest-first; skip the first (latest) and delete the rest
          $toDelete = $versions | Select-Object -Skip 1
          foreach ($ver in $toDelete) {
            Write-Host "Deleting $($pkg.name) version $($ver.name) (id $($ver.id))..."
            $deleteUrl = "https://api.github.com/user/packages/nuget/$($pkg.name)/versions/$($ver.id)"
            try {
              Invoke-RestMethod -Method Delete -Uri $deleteUrl -Headers $headers
              Write-Host "  Deleted."
            } catch {
              Write-Host "  Failed to delete: $_"
            }
          }
        }
